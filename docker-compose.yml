services:
  issue-tracker:
    build: .
    container_name: vllm-ascend-issue-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-vllm-project/vllm-ascend}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
    volumes:
      - ./data:/data
